<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lucian Logs — Login</title>

  <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-card">

      <a href="/" class="brand" aria-label="Go to homepage">
        <span>◆</span>
        Lucian Logs
      </a>


      <div class="auth-heading">

        <p class="eyebrow">
          WELCOME BACK
        </p>

        <h1>
          Sign in
        </h1>

        <p>
          Continue monitoring your applications.
        </p>

      </div>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >

        </div>


        <div
          id="loginMessage"
          class="message"
        ></div>


        <button
          type="submit"
          id="loginBtn"
          class="primary-btn"
        >
          Sign In
        </button>

      </form>


      <p class="auth-footer">
        <a href="/forgot-password.html">Forgot password?</a>
      </p>

      <p class="auth-footer">

        Don't have an account?

        <a href="/register.html">
          Create one
        </a>

      </p>

      <p class="auth-footer">
        <a href="/documentation.html">Read documentation</a>
      </p>

    </div>

  </main>


  <script src="/js/login.js"></script>

</body>
</html>
