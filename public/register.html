<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lucian Logs — Create Account</title>

  <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-card">

      <div class="brand">
        <span>◆</span>
        Lucian Logs
      </div>

      <div class="auth-heading">
        <p class="eyebrow">GET STARTED</p>
        <h1>Create your account</h1>
        <p>
          Start monitoring your applications with Lucian Logs.
        </p>
      </div>


      <form id="registerForm">

        <div class="form-group">

          <label for="name">
            Name
          </label>

          <input
            type="text"
            id="name"
            placeholder="Your name"
            autocomplete="name"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <div
          id="registerMessage"
          class="message"
        ></div>


        <button
          type="submit"
          id="registerBtn"
          class="primary-btn"
        >
          Create Account
        </button>

      </form>


      <p class="auth-footer">
        Already have an account?
        <a href="/login.html">Sign in</a>
      </p>

    </div>

  </main>


  <script src="/js/register.js"></script>

</body>
</html>
