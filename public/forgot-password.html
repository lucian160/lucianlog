<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucian Logs — Reset Password</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <span>◆</span>
        Lucian Logs
      </div>

      <div class="auth-heading">
        <p class="eyebrow">SECURITY</p>
        <h1>Reset password</h1>
        <p>We’ll send a one-time code to your email.</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div id="forgotPasswordMessage" class="message"></div>

        <button type="submit" id="sendOtpBtn" class="primary-btn">Send code</button>
      </form>

      <p class="auth-footer">
        Back to
        <a href="/login.html">Login</a>
      </p>
    </div>
  </main>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
