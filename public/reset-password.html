<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucian Logs — Confirm Reset</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <a href="/" class="brand" aria-label="Go to homepage">
        <span>◆</span>
        Lucian Logs
      </a>

      <div class="auth-heading">
        <p class="eyebrow">VERIFICATION</p>
        <h1>Enter code</h1>
        <p>Check your email and enter the one-time password.</p>
      </div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="resetOtp">Verification code</label>
          <input type="text" id="resetOtp" placeholder="123456" inputmode="numeric" maxlength="6" required />
        </div>

        <div class="form-group">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="New password" autocomplete="new-password" required />
        </div>

        <div id="resetPasswordMessage" class="message"></div>

        <button type="submit" id="resetPasswordBtn" class="primary-btn">Reset password</button>
      </form>

      <p class="auth-footer">
        Need a new code?
        <button id="resendResetOtpBtn" type="button" class="secondary-btn">Resend OTP</button>
      </p>

      <p class="auth-footer">
        <a href="/documentation.html">Read documentation</a>
      </p>
    </div>
  </main>

  <script src="/js/reset-password.js"></script>
</body>
</html>
